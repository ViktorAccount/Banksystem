# --- Server setup ---
server.port=8080
spring.main.web-application-type=servlet
spring.main.allow-bean-definition-overriding=true

# --- Kafka setup for Docker ---
spring.kafka.producer.bootstrap-servers=kafka-service:9092
spring.kafka.admin.fail-fast=false
spring.kafka.bootstrap-servers=kafka-service:9092
spring.kafka.consumer.bootstrap-servers=kafka-service:9092

# --- Derby setup for account REST ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.driver-class-name=org.apache.derby.jdbc.EmbeddedDriver
spring.jpa.database-platform=org.hibernate.dialect.DerbyDialect
spring.datasource.url=jdbc:derby:memory:accountDB;create=true
spring.jpa.show-sql=false

# --- MVC configuration ---
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
